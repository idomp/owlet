[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RUF", "D", "PL", "ASYNC"]
ignore = ["D202", "D203", "D213", "E501", "PLR2004", "PLR0913", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.owlet", "homeassistant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLR0913"]
# Vendored from lucasvollebergh/pyowletapi, kept identical to ease syncing.
"custom_components/owlet/owletapi/*" = ["D", "PL", "SIM"]
"tests/owletapi/*" = ["D", "PL", "SIM"]

[tool.coverage.run]
source = ["custom_components.owlet"]

[tool.coverage.report]
# The fork started at 93 %, it must not drop below that.
fail_under = 93
